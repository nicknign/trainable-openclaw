# GRPO training: Qwen3.5-2B on tau-bench retail via Agent Loop
# Train: 66 tasks, Val: 18 tasks
# Single RTX 4090 48GB, LoRA rank=64, n=4 rollouts
# Multi-turn tool calling inside Agent Loop (zero API cost)
# Usage: python -m verl.trainer.main_ppo --config-path scripts/train --config-name grpo_retail

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: /data/wangye/trainable-openclaw/data/tau_bench/train_agent_66.jsonl
  val_files: /data/wangye/trainable-openclaw/data/tau_bench/val_agent_18.jsonl
  max_prompt_length: 4096  # tool defs make prompts ~2700 tokens
  max_response_length: 8192  # balanced for 2B on 48GB
  train_batch_size: 2
  return_raw_chat: True  # REQUIRED for Agent Loop
  truncation: left  # truncate overlong prompts instead of error

actor_rollout_ref:
  model:
    path: /data/models/Qwen3.5-2B
    enable_gradient_checkpointing: true
    lora_rank: 64
    lora_alpha: 128
    target_modules:
      - out_proj      # not fused by vLLM
      - down_proj     # not fused by vLLM
      # in_proj_qkv/in_proj_z fused→in_proj_qkvz, in_proj_b/in_proj_a fused→in_proj_ba
      # gate_proj/up_proj fused→gate_up_proj — all cause LoRA shape mismatch
  rollout:
    name: vllm
    mode: async  # Agent Loop requires async
    n: 4
    temperature: 0.9
    top_p: 0.95
    max_model_len: 8192  # 2B fits comfortably on 48GB
    gpu_memory_utilization: 0.50
    tensor_model_parallel_size: 1
    enforce_eager: true  # disable CUDA graphs — avoids Qwen3.5 LoRA IndexError
    calculate_log_probs: true  # GRPO needs log probs
    prompt_length: 4096  # must match data.max_prompt_length
    response_length: 8192  # must match data.max_response_length
    multi_turn:
      enable: True
      max_user_turns: 2
      max_assistant_turns: 2
      format: qwen3_coder  # Qwen3.5 native XML tool call format
      function_tool_path: /data/wangye/trainable-openclaw/trainable_openclaw/training/agent_tools.py
      max_tool_response_length: 1024
      tokenization_sanity_check_mode: ignore_strippable
    agent:
      num_workers: 2
      default_agent_loop: tool_agent
  actor:
    ppo_mini_batch_size: 2
    ppo_epochs: 1
    optim:
      lr: 2.0e-5
    clip_ratio: 0.2
    entropy_coeff: 0.01
    kl_loss_coef: 0.0  # disable reference policy to save GPU memory
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 16384
  ref:
    log_prob_max_token_len: 32768

critic:
  enable: false
  model:
    path: /data/models/Qwen3.5-2B

algorithm:
  adv_estimator: grpo

reward:
  reward_manager:
    source: register
    name: naive
  custom_reward_function:
    path: pkg://trainable_openclaw.training.grpo_reward
    name: compute_score
    reward_kwargs: {}

trainer:
  total_training_steps: 200
  project_name: tau-bench-retail
  experiment_name: grpo-agent
  logger: ["console"]
  save_freq: 50
  test_freq: 50
  n_gpus_per_node: 1
  nnodes: 1
  val_before_train: false
