# GRPO training: Qwen3.5-4B on tau-bench retail
# 84 training prompts, single RTX 4090 48GB, LoRA rank=16
# Usage: python -m verl.trainer.main_ppo --config-path scripts/train --config-name grpo_retail

defaults:
  - verl/trainer/config/ppo_trainer
  - _self_

data:
  train_files: data/tau_bench/train_prompts_augmented.jsonl
  val_files: data/tau_bench/val_prompts_augmented.jsonl
  max_prompt_length: 2048
  max_response_length: 4096
  train_batch_size: 4

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: Qwen/Qwen3.5-4B
    enable_gradient_checkpointing: true
  model_peft:
    peft_type: lora
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
  rollout:
    name: vllm
    n: 4
    temperature: 0.9
    top_p: 0.95
    max_model_len: 8192
    gpu_memory_utilization: 0.70
    tensor_model_parallel_size: 1
    enforce_eager: false
    free_cache_engine: true
  actor:
    ppo_mini_batch_size: 4
    ppo_epochs: 1
    optim:
      lr: 2.0e-6
    clip_ratio: 0.2
    entropy_coeff: 0.01
    kl_loss_coef: 0.05
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 12288
  ref:
    log_prob_max_token_len: 32768

reward:
  reward_manager:
    source: register
    name: naive
  custom_reward_function:
    path: trainable_openclaw.training.grpo_reward
    name: compute_score
    reward_kwargs: {}

trainer:
  total_training_steps: 200
  project_name: tau-bench-retail
  experiment_name: grpo-r1
  logger: ["console", "wandb"]
  save_freq: 50
  test_freq: 50
  n_gpus_per_node: 1
  nnodes: 1
  val_before_train: false
